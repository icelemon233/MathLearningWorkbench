name: Publish compiled site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-compiled-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public configuration
        run: node scripts/validate-config.mjs

      - name: Test
        run: |
          pnpm test
          pnpm test:ai

      - name: Build
        run: pnpm build

      - name: Check build for credentials
        run: node scripts/validate-config.mjs --check-dist

      - name: Check public file boundary
        run: |
          pnpm test:publish
          node scripts/validate-public-build.mjs

      # The key can write only to the distribution repository. Load it after
      # dependency installation, tests and the build have completed.
      - name: Check out compiled-site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: icelemon233/CinnaGithubPage
          ref: main
          path: published-site
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          persist-credentials: true

      - name: Publish compiled files only
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test -d published-site/.git
          git -C published-site rm -r --ignore-unmatch -- math-learning-workbench >/dev/null
          mkdir -p published-site/math-learning-workbench
          cp -a dist/. published-site/math-learning-workbench/
          printf '{"revision":"%s"}\n' "$SOURCE_REVISION" > published-site/math-learning-workbench/release.json
          git -C published-site add -- math-learning-workbench
          if ! git -C published-site diff --cached --quiet; then
            git -C published-site -c user.name='Cinna' -c user.email='maintainer@users.noreply.github.com' commit -m "Publish $SOURCE_REVISION"
            git -C published-site push origin HEAD:main
          fi
